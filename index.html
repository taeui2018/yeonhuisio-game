<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>연희시오 야탑점 — 오늘의 셰프 도전</title>
<!--
  카카오톡·네이버 공유 미리보기(OG) — 미리보기 봇은 JS를 읽지 않으므로 여기 값을 직접 고치세요.
  og:image 는 반드시 https:// 로 시작하는 전체 주소(1200×630 권장)여야 합니다.
-->
<meta name="description" content="1분 동안 연희시오 셰프가 되어 사케동·삼색 야키토리·스프카레를 직접 담아보세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="연희시오 야탑점 — 오늘의 셰프 도전">
<meta property="og:description" content="1분 동안 셰프가 되어 사케동·야키토리·스프카레를 직접 담아보세요.">
<meta property="og:image" content="https://taeui2018.github.io/yeonhuisio-game/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://taeui2018.github.io/yeonhuisio-game/">
<meta name="theme-color" content="#2a1c13">
<style>
:root{
  --wall1:#2a1c13; --wall2:#432f21; --lamp:#f6c96a;
  --wood1:#b07a42; --wood2:#8a5a2c; --wood3:#6e4520;
  --cream:#f7efe1; --paper:#fffaf1; --ink:#2b2420; --sub:#7a6a5c;
  --accent:#d8612f; --accent2:#b44c20; --ok:#3f9b56; --warn:#e0a526; --bad:#d64532;
  --line:#e3d5bf;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1a110b;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:#efe3cf}

/* ---------- 상단바 ---------- */
#top{flex:0 0 44px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--wall1);color:#f6ead6;font-size:13px;font-weight:700;padding-top:env(safe-area-inset-top)}
#top .pill{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:5px 9px;white-space:nowrap}
#clock{font-variant-numeric:tabular-nums;font-size:15px}
#score{font-variant-numeric:tabular-nums;margin-left:auto}
#seatsPill.full{background:#8e2f1e}
.snd{flex:0 0 40px;width:40px;height:44px;font-size:18px;display:flex;align-items:center;justify-content:center}
#bgmBtn{margin-right:-6px}

/* ---------- 카운터 ---------- */
#counter{flex:1 1 auto;min-height:126px;max-height:40vh;position:relative;
  background:radial-gradient(60px 40px at 20% 0%,rgba(246,201,106,.45),transparent 70%),
             radial-gradient(60px 40px at 50% 0%,rgba(246,201,106,.45),transparent 70%),
             radial-gradient(60px 40px at 80% 0%,rgba(246,201,106,.45),transparent 70%),
             linear-gradient(var(--wall1),var(--wall2));overflow:hidden}
#counter .lamp{position:absolute;top:0;width:18px;height:10px;border-radius:0 0 10px 10px;background:var(--lamp);box-shadow:0 0 18px 6px rgba(246,201,106,.5)}
#seats{position:absolute;left:4px;right:4px;top:6px;bottom:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.seat{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0}
.seat .ticket{background:var(--paper);border-radius:6px;padding:3px 4px 4px;font-size:11px;font-weight:800;line-height:1.15;text-align:center;
  box-shadow:0 2px 0 rgba(0,0,0,.25);width:100%;max-width:74px;border-top:4px solid var(--c,#999);position:relative}
.seat .ticket .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .pat{height:5px;margin-top:3px;border-radius:3px;background:#e7dccb;overflow:hidden}
.seat .pat i{display:block;height:100%;width:100%;background:var(--ok);transform-origin:left center}
.seat .cust{width:min(80px,100%);height:auto;display:block;margin-top:2px}
.seat.enter .cust,.seat.enter .ticket{animation:enter .35s ease-out}
.seat.leave{animation:fade .45s ease-in forwards}
.seat.urgent .ticket{animation:wob .5s infinite}
@keyframes enter{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(-10px)}}
@keyframes wob{50%{transform:rotate(-3deg)}}
.pop{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-weight:900;font-size:15px;color:#ffe08a;text-shadow:0 1px 0 #000;animation:pop .9s ease-out forwards;pointer-events:none;white-space:nowrap}
.pop.bad{color:#ff8f7a}
@keyframes pop{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}
#bar{position:absolute;left:0;right:0;bottom:0;height:20px;background:linear-gradient(var(--wood1),var(--wood2) 60%,var(--wood3));box-shadow:0 -2px 6px rgba(0,0,0,.35)}
#waitline{position:absolute;right:6px;bottom:24px;font-size:11px;color:#f6ead6;font-weight:700;opacity:.9}
#banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:28px;font-weight:900;color:#fff4d6;text-shadow:0 2px 0 #7a3b12,0 0 18px rgba(246,201,106,.8);opacity:0}
#banner.show{animation:ban 1.4s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1.05)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}

/* ---------- 레시피 카드 ---------- */
#recipe{flex:0 0 auto;min-height:68px;background:var(--paper);border-bottom:1px solid var(--line);padding:4px 8px 5px;display:flex;flex-direction:column;justify-content:center;gap:2px}
#recipe .rt{font-size:13px;font-weight:900;line-height:1.2;color:var(--c,#444)}
#recipe .rt small{font-size:11px;color:var(--sub);font-weight:700;margin-left:6px}
#recipe .steps{display:flex;align-items:stretch;gap:3px;flex-wrap:nowrap;min-width:0;overflow:hidden}
#recipe .stg{display:flex;gap:1px;padding:2px;border-radius:8px;background:#f3ead9;min-width:0}
#recipe .stg.cur{background:#ffe7c7;box-shadow:inset 0 0 0 2px #f0b468}
#recipe .arw{flex:0 0 auto;align-self:center;font-size:12px;color:#b9a68e;font-weight:900}
.chip{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.1;font-weight:800;color:#5a4a3c;text-align:center;letter-spacing:-.6px;white-space:nowrap}
.chip span{display:block;max-width:100%;overflow:hidden;text-overflow:clip}
.chip svg{width:24px;height:24px}
.chip.done{opacity:.35}
.chip.done svg{filter:grayscale(.6)}
#recipe .empty{font-size:13px;color:var(--sub);font-weight:700}
#recipe .mastery{font-size:12px;font-weight:800;color:#a3621a}

/* ---------- 작업대 ---------- */
#work{flex:0 0 auto;height:clamp(108px,19vh,168px);display:flex;align-items:stretch;gap:6px;padding:6px 8px;background:linear-gradient(#eadcc4,#e3d2b6)}
#work .side{display:flex;flex-direction:column;gap:6px;width:72px}
.tool{flex:1;min-height:44px;border-radius:12px;background:var(--paper);box-shadow:0 2px 0 #c9b597;font-size:12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tool svg{width:26px;height:18px}
.tool.on{background:#e3f3e2;box-shadow:inset 0 0 0 2px var(--ok)}
.tool:active{transform:translateY(1px)}
#bowlWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
#bowl{width:100%;height:100%;max-width:240px}
#bowl.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#bowlLabel{position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:11px;font-weight:800;color:#6e5a45}
#serve{width:74px;border-radius:14px;background:var(--accent);color:#fff;font-weight:900;font-size:17px;box-shadow:0 3px 0 var(--accent2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#serve small{font-size:10px;font-weight:700;opacity:.9}
#serve:disabled{background:#c9bba6;box-shadow:0 3px 0 #a99a84;color:#f4eee4}
#serve.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}

/* ---------- 재료 ---------- */
#pantry{flex:0 1 auto;min-height:0;align-content:start;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(48px,8.6vh,74px);gap:6px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:#efe3cf;align-content:stretch}
.ing{border-radius:12px;background:var(--paper);box-shadow:0 2px 0 #cdb99a;border-top:4px solid var(--c,#bbb);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:800;line-height:1.1;min-height:44px;padding:2px;letter-spacing:-.3px}
.ing svg{width:30px;height:30px;flex:0 0 auto}
.ing:active{transform:translateY(1px)}
.ing.bad{animation:flash .35s}
.ing.new{animation:newi 1.2s}
@keyframes flash{50%{background:#ffd4cc}}
@keyframes newi{0%,60%{box-shadow:0 0 0 3px var(--lamp)}}

/* ---------- 크리스마스 테마 (CONFIG.theme = "xmas") ---------- */
body.xmas{--wall1:#0f2e1f;--wall2:#18492f;--lamp:#f2c75c}
body.xmas #top{background:#0b2417}
body.xmas #counter{background:linear-gradient(var(--wall1),var(--wall2))}
body.xmas #counter .lamp{display:none}
#lights,#garland,#snow{display:none;position:absolute;left:0;right:0;pointer-events:none}
body.xmas #lights{display:block;top:0;height:30px;z-index:1}
body.xmas #garland{display:block;bottom:12px;height:18px;z-index:3}
body.xmas #snow{display:block;inset:0;overflow:hidden;z-index:0}
#xtree,#xsleigh{display:none;position:absolute;pointer-events:none}
body.xmas #xtree{display:block;right:2px;bottom:14px;height:min(72%,150px);aspect-ratio:200/280;z-index:1}
body.xmas #xsleigh{display:block;top:30px;left:0;width:min(30%,130px);aspect-ratio:320/110;z-index:1;animation:fly 16s linear infinite}
@keyframes fly{0%{transform:translate(-140px,6px)}25%{transform:translate(calc(25vw),-2px)}50%{transform:translate(calc(50vw),6px)}75%{transform:translate(calc(75vw),-2px)}100%{transform:translate(calc(100vw + 20px),6px)}}
@media (min-width:481px){@keyframes fly{0%{transform:translate(-140px,6px)}100%{transform:translate(500px,6px)}}}
@media (prefers-reduced-motion:reduce){body.xmas #xsleigh{animation:none;transform:translate(6px,0)}}
#lights svg,#garland svg{width:100%;height:100%;display:block}
#snow i{position:absolute;top:-8px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(240px) translateX(14px)}}
body.xmas #lights .b{animation:twinkle 1.6s ease-in-out infinite}
body.xmas #lights .b:nth-child(3n){animation-delay:.5s}body.xmas #lights .b:nth-child(3n+1){animation-delay:1s}
@keyframes twinkle{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){#snow i,body.xmas #lights .b{animation:none}}
body.xmas #seats{z-index:2}
body.xmas #bar{background:linear-gradient(#b07a42,#8a5a2c 60%,#6e4520)}
body.xmas .rhead{background:linear-gradient(#0f2e1f,#18492f)}
.rhead .xm{display:none}
body.xmas .rhead .xm{display:inline-block;background:#c8323a;color:#fff4dc;font-size:11px;font-weight:900;padding:3px 10px;border-radius:999px;margin-bottom:6px}
body.xmas #work{background:linear-gradient(#efe3cf,#e6d6bb)}
body.xmas .tool.on{background:#e7f3e4}
body.xmas #serve:not(:disabled){background:#c8323a;box-shadow:0 3px 0 #9c2228}

@media (max-height:580px){
  #counter{min-height:100px}
  #recipe{min-height:60px;padding:3px 8px}
  .chip svg{width:20px;height:20px}
  #work{height:96px;padding:4px 8px}
  #pantry{grid-auto-rows:44px;gap:5px;padding-top:5px}
  .ing{flex-direction:row;gap:4px;font-size:11.5px;border-top-width:3px}
  .ing svg{width:22px;height:22px}
}
/* ---------- 가이드·코치 ---------- */
#guide{position:fixed;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:4px solid #ffb02e;pointer-events:none;z-index:40;display:none;animation:ring 1s infinite}
#guide::after{content:"여기!";position:absolute;left:50%;top:-24px;transform:translateX(-50%);background:#ffb02e;color:#3a2200;font-size:12px;font-weight:900;padding:2px 7px;border-radius:8px;white-space:nowrap}
@keyframes ring{50%{transform:scale(.82)}}
#coach{position:absolute;left:calc(20% + 6px);right:6px;top:8px;max-height:calc(100% - 32px);overflow:hidden;background:rgba(255,250,241,.97);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;line-height:1.35;box-shadow:0 4px 12px rgba(0,0,0,.3);display:none;z-index:5}
#coach b{color:var(--accent2)}
#coach .tip{display:block;font-size:11px;color:var(--sub);margin-top:2px}
#skipTut{display:none;white-space:nowrap;min-height:44px;padding:0 12px;margin-left:auto;font-size:12px;font-weight:800;color:#f6ead6;border-radius:999px;background:rgba(255,255,255,.14)}
#skipTut.show{display:block}
#skipTut.show~#score{margin-left:0}
#top.tut #seatsPill{display:none}

/* ---------- 모달 ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(20,12,6,.6);padding:20px}
#modal.show{display:flex}
#modal .box{background:var(--paper);border-radius:18px;max-width:360px;width:100%;padding:18px 18px 14px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);max-height:90%;overflow:auto}
#modal h3{margin:4px 0 6px;font-size:18px}
#modal p{margin:6px 0;font-size:14px;line-height:1.5;color:#4a3d33}
#modal .big{display:block;width:100%;min-height:48px;border-radius:12px;background:var(--accent);color:#fff;font-weight:900;font-size:16px;margin-top:10px}
#modal .ghost{display:block;width:100%;min-height:44px;border-radius:12px;background:#efe5d4;font-weight:800;margin-top:8px;font-size:14px;text-decoration:none;color:var(--ink);line-height:44px}
#modal img.card{width:100%;border-radius:10px;display:block;margin-top:6px;-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
#modal input{width:100%;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:10px;user-select:text;-webkit-user-select:text}

#toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:rgba(30,20,12,.92);color:#fff4dc;font-weight:800;font-size:13px;line-height:1.4;padding:8px 14px;border-radius:16px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;width:max-content;max-width:92vw;text-align:center;word-break:keep-all}
#toast.show{opacity:1}

/* ---------- 결과 ---------- */
/* ---------- 월간 랭킹 ---------- */
.rkcard{background:var(--paper);border-radius:16px;margin-top:12px;padding:12px 14px 14px;box-shadow:0 2px 0 var(--line);border:2px solid #f2c75c}
.rkhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rkhead b{font-size:16px;font-weight:900}
.rkhead>span{font-size:11px;color:var(--sub);font-weight:700}
.rkprz{display:flex;gap:6px;margin-top:8px}
.rkprz div{flex:1;background:#fff3d6;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:800;line-height:1.3}
.rkprz div i{display:block;font-style:normal;font-size:18px}
.rkform{display:flex;gap:6px;margin-top:10px}
.rkform input{flex:1;min-width:0;height:46px;border-radius:12px;border:2px solid var(--line);background:#fff;padding:0 12px;font:inherit;font-size:16px;font-weight:700;-webkit-user-select:text;user-select:text}
.rkform button{flex:0 0 auto;height:46px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--accent2)}
.rkform button:disabled{opacity:.5}
.rkmsg{font-size:12px;color:var(--sub);margin-top:6px;min-height:16px;font-weight:700}
.rkmsg.err{color:var(--bad)}
.rklist{list-style:none;margin:10px 0 0;padding:0}
.rklist li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;font-weight:800;font-size:14px}
.rklist li:nth-child(odd){background:#f8f0e2}
.rklist li.me{background:#ffe7b8;outline:2px solid #f2c75c}
.rklist .no{flex:0 0 26px;text-align:center;font-size:15px}
.rklist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rklist .pt{font-variant-numeric:tabular-nums}
.rklist .empty{justify-content:center;color:var(--sub);font-weight:700;background:none!important}
.rkme{margin-top:8px;text-align:center;font-size:14px;font-weight:900}
.rkme small{font-weight:700;color:var(--sub)}
.rkcode{margin-top:8px;background:#2b2420;color:#fff4dc;border-radius:12px;padding:10px;text-align:center}
.rkcode .c{font-size:24px;font-weight:900;letter-spacing:3px;font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text}
.rkcode .h{font-size:11px;opacity:.8;margin-top:2px;line-height:1.45}
.rkprev{margin-top:8px;font-size:12px;color:var(--sub);text-align:center;font-weight:700;line-height:1.5}
.rkrule{margin-top:8px;font-size:12px;color:var(--sub)}
.rkrule summary{font-weight:800;cursor:pointer;list-style:none;text-align:center}
.rkrule summary::-webkit-details-marker{display:none}
.rkrule ul{margin:6px 0 0;padding-left:18px;line-height:1.55}
.rkrename{background:none;color:var(--sub);font-size:12px;font-weight:700;text-decoration:underline;margin-left:4px}
#result{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--cream);display:none}
#result.show{display:block}
#result .wrap{max-width:480px;margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
.rhead{text-align:center;background:linear-gradient(var(--wall1),var(--wall2));color:#fff4dc;border-radius:18px;padding:12px 12px 12px;position:relative;overflow:hidden}
.rhead .store{font-size:12px;opacity:.8;font-weight:700}
.rhead .rank{display:inline-block;margin-top:6px;background:var(--lamp);color:#3a2200;font-weight:900;padding:4px 12px;border-radius:999px;font-size:14px}
.rhead .sc{font-size:40px;font-weight:900;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.rhead .stats{display:flex;justify-content:center;gap:14px;font-size:12px;margin-top:6px;opacity:.9;font-weight:700}
.rhead .best{font-size:11px;opacity:.75;margin-top:4px}
.mcard{background:var(--paper);border-radius:16px;margin-top:12px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.mcard .ph{aspect-ratio:2/1;background:#f0e3cd;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .ph svg{width:88%;height:auto}
.mcard .body{padding:12px 14px 14px}
.mcard .k{font-size:11px;color:var(--sub);font-weight:800}
.mcard h2{margin:2px 0 2px;font-size:19px}
.mcard .desc{font-size:13px;color:#5a4a3c;margin:0 0 10px}
.howto{background:#fff3e0;border-radius:12px;padding:10px 12px}
.howto .t{font-size:12px;font-weight:900;color:var(--accent2);margin-bottom:6px}
.howto+.howto{margin-top:8px}
.howto.other{background:#f6efe3}
.howto.other .t{color:#6e4a2a;margin:0;min-height:28px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none}
.howto.other .t::-webkit-details-marker{display:none}
.howto.other .t::after{content:"펼치기 ▾";font-size:11px;color:var(--sub)}
.howto.other[open] .t::after{content:"접기 ▴"}
.howto.other[open] ol{margin-top:6px}
.howcard{background:var(--paper);border-radius:16px;margin-top:12px;padding:12px 14px 14px;box-shadow:0 2px 0 var(--line)}
.howcard .howhead{font-size:13px;font-weight:900;color:#7a3b12;margin:0 0 8px}
.howto ol{margin:0;padding-left:20px;font-size:13px;line-height:1.55}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.act{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;font-weight:900;font-size:16px;text-decoration:none;background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent2);text-align:center;padding:0 12px}
.act.sec{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.event{word-break:keep-all;margin-top:12px;background:#fff6e6;border:2px dashed #c8323a;border-radius:16px;padding:12px 14px 14px;text-align:center}
.event .et{display:inline-block;background:#c8323a;color:#fff4dc;font-size:12px;font-weight:900;padding:4px 12px;border-radius:999px}
.event .eg{font-size:17px;font-weight:900;margin:8px 0 4px;line-height:1.35;color:#2b2420}
.event .eg b{color:#c8323a}
.event .eh{font-size:13px;color:#5a4a3c;line-height:1.5;margin:0}
.event .ek{font-size:13px;font-weight:800;color:#7a4a1a;margin:6px 0 0;line-height:1.45}
.event .en{font-size:11px;color:var(--sub);margin:2px 0 0}
.event .row2{margin-top:10px}
.act.note{flex-direction:column;background:#fff1dc;color:#7a3b12;box-shadow:0 3px 0 #ecd3ad;cursor:default;padding:8px 12px}
.act.note small{font-size:13px;font-weight:700;margin-top:2px;color:#8a5a2c}
.act.green{background:#03c75a;box-shadow:0 3px 0 #02a04a}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info{margin-top:14px;font-size:12px;color:var(--sub);line-height:1.6;text-align:center}
.info b{color:var(--ink)}
.offpeak{margin-top:8px;font-size:12px;font-weight:800;color:#8a5a14;text-align:center;background:#fff1cf;border-radius:10px;padding:8px}

/* ---------- 사운드 (Web Audio — 효과음 + 캐럴 BGM, 음원 파일 없음) ---------- */
// BGM: 전통 캐럴 "Jingle Bells"(1857, 저작권 만료) 후렴 멜로디를 직접 연주
const SND = CONFIG.sound || { sfx:true, bgm:true };
let actx = null, master = null, bgmBus = null, noiseBuf = null;
let sfxOn = store.get("sfx")!==null ? store.get("sfx")==="1" : !!SND.sfx;
let bgmOn = store.get("bgm")!==null ? store.get("bgm")==="1" : !!SND.bgm;
function ensureAudio(){
  if(actx){ if(actx.state==="suspended" && !document.hidden) actx.resume(); return true; }
  try{
    actx = new (window.AudioContext||window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = .9; master.connect(actx.destination);
    bgmBus = actx.createGain(); bgmBus.gain.value = .55; bgmBus.connect(master);
    noiseBuf = actx.createBuffer(1, actx.sampleRate*.08, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1)*(1-i/d.length);
  }catch(e){ actx=null; return false; }
  return true;
}
function tone(f, d, type, v, when, bus, at){
  if(!actx) return;
  try{
    const t = (at!=null ? at : actx.currentTime) + (when||0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type||"sine"; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v||.1, t+.008); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g).connect(bus||master); o.start(t); o.stop(t+d+.03);
  }catch(e){}
}
function fx(fn){ if(!sfxOn || !ensureAudio()) return; fn(); }
const sfx = {
  tap(){  fx(()=>{ tone(880,.06,"triangle",.09); tone(1320,.05,"sine",.05,.025); }); },              // 재료 담기
  tray(){ fx(()=>{ tone(520,.07,"triangle",.08); tone(780,.06,"sine",.04,.03); }); },               // 쟁반
  done(){ fx(()=>{ [1047,1319,1568,2093].forEach((f,i)=>tone(f,.22,"sine",.08,i*.07)); }); },      // 그릇 완성
  bad(){  fx(()=>{ tone(170,.16,"square",.045); tone(140,.16,"square",.035,.08); }); },
  serve(){ fx(()=>{ tone(1568,.25,"sine",.1); tone(2093,.35,"sine",.09,.09); tone(3136,.3,"sine",.03,.09); }); },
  leave(){ fx(()=>{ tone(300,.2,"sawtooth",.04); tone(220,.25,"sawtooth",.04,.15); }); },
  open(){ fx(()=>{ tone(784,.12,"sine",.09); tone(988,.12,"sine",.09,.1); tone(1175,.12,"sine",.09,.2); tone(1568,.3,"sine",.09,.3); }); }
};
// --- 캐럴 BGM ---
const Q = .34;   // 4분음표 길이(초)
const E4=76,F4=77,G4=79,C4=72,D4=74;   // 한 옥타브 위에서 종소리처럼
const A1=[[E4,1],[E4,1],[E4,2],[E4,1],[E4,1],[E4,2],[E4,1],[G4,1],[C4,1.5],[D4,.5],[E4,4],[F4,1],[F4,1],[F4,1.5],[F4,.5],[F4,1],[E4,1],[E4,1],[E4,.5],[E4,.5]];
const SONG=A1.concat([[E4,1],[D4,1],[D4,1],[E4,1],[D4,2],[G4,2]], A1, [[G4,1],[G4,1],[F4,1],[D4,1],[C4,4]]);
const BARS=[48,48,48,48,41,48,50,43, 48,48,48,48,41,48,43,48];   // 마디별 베이스 근음
let bgmTimer=null, nextNote=0, noteIdx=0, nextBeat=0, beatIdx=0;
const mf = m => 440*Math.pow(2,(m-69)/12);
function bell(m,t,len){ tone(mf(m),Math.min(len,.9)+.25,"sine",.055,0,bgmBus,t); tone(mf(m)*2.005,.35,"sine",.015,0,bgmBus,t); }
function shaker(t,v){ try{ const s=actx.createBufferSource(); s.buffer=noiseBuf; const f=actx.createBiquadFilter(); f.type="highpass"; f.frequency.value=6500; const g=actx.createGain(); g.gain.value=v; s.connect(f).connect(g).connect(bgmBus); s.start(t); }catch(e){} }
function bgmTick(){
  if(!actx) return;
  while(nextNote < actx.currentTime+.5){ const [m,b]=SONG[noteIdx]; bell(m,nextNote,b*Q); nextNote+=b*Q; noteIdx=(noteIdx+1)%SONG.length; }
  while(nextBeat < actx.currentTime+.5){ const bar=Math.floor(beatIdx/4)%16, bt=beatIdx%4;
    if(bt%2===0) tone(mf(BARS[bar]),Q*1.6,"triangle",.05,0,bgmBus,nextBeat);
    shaker(nextBeat+Q/2, .05); if(bt%2===1) shaker(nextBeat, .035);
    nextBeat+=Q; beatIdx=(beatIdx+1)%64; }
}
function bgmStart(){ if(!bgmOn || bgmTimer || !ensureAudio()) return; nextNote=nextBeat=actx.currentTime+.15; noteIdx=0; beatIdx=0; bgmTimer=setInterval(bgmTick,120); bgmTick(); }
function bgmStop(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
function soundUI(){
  const a=$("#sfxBtn"), b=$("#bgmBtn");
  a.textContent = sfxOn ? "🔊" : "🔇"; a.setAttribute("aria-label", sfxOn ? "효과음 끄기" : "효과음 켜기");
  b.style.opacity = bgmOn ? "1" : ".35"; b.setAttribute("aria-label", bgmOn ? "캐럴 끄기" : "캐럴 켜기");
}
$("#sfxBtn").addEventListener("click", ()=>{ sfxOn=!sfxOn; store.set("sfx", sfxOn?"1":"0"); soundUI(); if(sfxOn){ ensureAudio(); sfx.tap(); } });
$("#bgmBtn").addEventListener("click", ()=>{ bgmOn=!bgmOn; store.set("bgm", bgmOn?"1":"0"); soundUI(); if(bgmOn) bgmStart(); else bgmStop(); });

/* ---------- 상태 ---------- */
const G = CONFIG.game, SC = CONFIG.score;
const MENU_IDS = Object.keys(MENU);
let S;
function fresh(){
  return { phase:"idle", prev:null, t:0, score:0, served:0, left:0, streak:0,
    servedBy:{}, mastered:new Set(), seats:[null,null,null,null,null], queue:[],
    nextSpawn:0, bowl:[], cands:[], tray:false, unlocked:[], forceNext:null, plan:(G.firstOrders||[]).slice(),
    tut:false, tutCust:null, uid:0, log:[] };
}
const allIngs = id => MENU[id].stages.flat();
function stageIdx(id, bowl){ const st = MENU[id].stages; for(let i=0;i<st.length;i++){ if(!st[i].every(x=>bowl.includes(x))) return i; } return st.length; }
function canAdd(id, bowl, ing){
  if(bowl.includes(ing)) return false;
  const all = allIngs(id); if(!bowl.every(x=>all.includes(x))) return false;
  const si = stageIdx(id, bowl); if(si >= MENU[id].stages.length) return false;
  return MENU[id].stages[si].includes(ing);
}
function completeMenu(){ return S.cands.find(id => stageIdx(id,S.bowl)===MENU[id].stages.length && S.bowl.length===allIngs(id).length) || null; }
function bowlType(){ return S.bowl.includes("soup") ? "soup" : "don"; }
function seated(){ return S.seats.filter(Boolean); }
function seatLimit(){ let n=5; for(const [at,v] of (G.seatLimit||[])) if(S.t>=at) n=v; return Math.min(5,n); }
function urgentFor(menuId){
  let best=null; for(const c of seated()){ if(c.leaving) continue; if(menuId && c.menu!==menuId) continue; if(!best || c.pat<best.pat) best=c; } return best;
}

/* ---------- UI 공통 ---------- */
let toastT=0;
function toast(msg, ms){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), ms||1600); }
function banner(text){ const b=$("#banner"); b.textContent=text; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); }
function modal(html){ $("#modalBox").innerHTML=html; $("#modal").classList.add("show"); }
function closeModal(){ $("#modal").classList.remove("show"); $("#modalBox").innerHTML=""; }
const fmt = n => n.toLocaleString("ko-KR");
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- 좌석 ---------- */
const seatsEl = $("#seats");
function buildSeats(){
  seatsEl.innerHTML = "";
  for(let i=0;i<5;i++){ const d=document.createElement("div"); d.className="seat"; d.dataset.i=i; seatsEl.appendChild(d); }
}
function renderSeat(i){
  const el = seatsEl.children[i], c = S.seats[i];
  el.className = "seat";
  if(!c){ el.innerHTML=""; return; }
  const m = MENU[c.menu];
  el.innerHTML = '<div class="ticket" style="--c:'+m.color+'"><span class="nm">'+esc(m.short)+'</span><div class="pat"><i></i></div></div>'+custSVG(c.type);
  c.el = el; c.bar = el.querySelector(".pat i"); c.face = el.querySelector(".face"); c.mood = "ok";
  el.classList.add("enter");
}
function pickCustType(){   // 남녀 반반 확률, 같은 성별 안에서는 무작위
  const fem = CUST.map((c,i)=>c.f?i:-1).filter(i=>i>=0), male = CUST.map((c,i)=>c.f?-1:i).filter(i=>i>=0);
  const pool = (Math.random()<0.5 ? fem : male); return pool[Math.floor(Math.random()*pool.length)];
}
function seatCustomer(c){
  const i = S.seats.indexOf(null); if(i<0 || seated().length >= seatLimit()) return false;
  S.seats[i] = c; c.seat = i; renderSeat(i); maybeTip(c.menu); renderRecipe(); updateServe(); return true;
}
function spawn(menuId){
  const opts = S.unlocked;
  if(menuId && S.plan[0]===menuId) S.plan.shift();
  let menu = menuId || S.forceNext;
  while(!menu && S.plan.length){ const nx=S.plan.shift(); if(opts.includes(nx)) menu=nx; }
  menu = menu || opts[Math.floor(Math.random()*opts.length)];
  S.forceNext = null;
  const c = { id:++S.uid, menu, type:pickCustType(), pat:1 };
  if(!seatCustomer(c)){ if(S.queue.length < G.maxQueue) S.queue.push(c); }
  updateHUD();
  return c;
}
function freeSeat(c, cls){
  const el = c.el; c.leaving = true;
  if(el){ el.classList.add("leave"); }
  setTimeout(()=>{
    if(S.seats[c.seat]===c){ S.seats[c.seat]=null; renderSeat(c.seat);
      if(S.queue.length && S.phase!=="end"){ const n=S.queue.shift(); n.pat=1; seatCustomer(n); }
      updateHUD(); renderRecipe(); updateServe(); }
  }, 450);
}
function popAt(c, text, bad){
  if(!c.el) return; const p=document.createElement("div"); p.className="pop"+(bad?" bad":""); p.textContent=text; c.el.appendChild(p);
  setTimeout(()=>p.remove(), 900);
}
function setMood(c){
  const mood = c.pat>.6 ? "ok" : c.pat>.3 ? "meh" : "mad";
  if(mood!==c.mood){ c.mood=mood; if(c.face) c.face.innerHTML=face(mood); if(c.el) c.el.classList.toggle("urgent", mood==="mad"); }
  if(c.bar){ c.bar.style.transform="scaleX("+Math.max(0,c.pat)+")"; c.bar.style.background = mood==="ok"?"var(--ok)":mood==="meh"?"var(--warn)":"var(--bad)"; }
}

/* ---------- HUD ---------- */
function updateHUD(){
  const mins = Math.round(S.t / G.seconds * 120);
  const h = 11 + Math.floor(mins/60), m = mins%60;
  $("#clock").textContent = h+":"+String(m).padStart(2,"0");
  $("#score").textContent = fmt(S.score)+"점";
  const occ = seated().length, n = Math.min(15, occ*3);
  $("#seatN").textContent = n;
  $("#seatsPill").classList.toggle("full", n>=15);
  $("#waitline").textContent = S.queue.length ? "입구 웨이팅 "+S.queue.length+"팀" : "";
}

/* ---------- 재료 ---------- */
function pantryIds(){ const out=[]; for(const id of S.unlocked) for(const x of allIngs(id)) if(!out.includes(x)) out.push(x); return out; }
function shuffled(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pantryOrder(){   // 판마다 재료 버튼 순서를 무작위로 섞음 (한 판 안에서는 고정)
  if(!S.order) S.order = shuffled(Object.keys(ING));
  return pantryIds().sort((x,y)=>S.order.indexOf(x)-S.order.indexOf(y));
}
function ingColor(x){ const owners = S.unlocked.filter(id=>allIngs(id).includes(x)); return owners.length===1 ? MENU[owners[0]].color : "#bfb29c"; }
function buildPantry(newOnes){
  const p = $("#pantry"); p.innerHTML="";
  for(const x of pantryOrder()){
    const b=document.createElement("button"); b.className="ing"+(newOnes&&newOnes.includes(x)?" new":""); b.dataset.ing=x;
    b.style.setProperty("--c", ingColor(x));
    b.innerHTML = icon(x)+'<span>'+esc(ING[x].name)+'</span>';
    b.addEventListener("click", ()=>tapIng(x, b));
    p.appendChild(b);
  }
}

/* ---------- 레시피 카드 ---------- */
function targetMenu(){
  if(S.bowl.length){
    if(S.cands.length===1) return S.cands[0];
    const u = seated().filter(c=>!c.leaving && S.cands.includes(c.menu)).sort((a,b)=>a.pat-b.pat)[0];
    return u ? u.menu : S.cands[0];
  }
  const u = urgentFor(null); return u ? u.menu : null;
}
function renderRecipe(){
  const r=$("#recipe"), id=targetMenu();
  if(!id){ r.innerHTML='<div class="empty">손님을 기다리는 중…</div>'; return; }
  const m=MENU[id]; r.style.setProperty("--c", m.color);
  const si = stageIdx(id, S.bowl.every(x=>allIngs(id).includes(x)) ? S.bowl : []);
  const head = '<div class="rt">'+esc(m.short)+'<small>'+(S.bowl.length?"만드는 중":"다음 주문")+' · '+m.stages.length+'단계</small></div>';
  if(S.mastered.has(id)){
    r.innerHTML = head+'<div class="mastery">★ 숙련! 레시피 없이 기억으로 담아 보세요</div>'; return;
  }
  let h='<div class="steps">';
  m.stages.forEach((st,i)=>{
    if(i) h+='<span class="arw">›</span>';
    h+='<div class="stg'+(i===si?" cur":"")+'" style="flex:'+st.length+' 1 0">';
    for(const x of st) h+='<div class="chip'+(S.bowl.includes(x)?" done":"")+'">'+icon(x)+'<span>'+esc(ING[x].name)+'</span></div>';
    h+='</div>';
  });
  r.innerHTML = head+h+'</div>';
}

/* ---------- 그릇 ---------- */
function renderBowl(){
  $("#bowl").innerHTML = bowlSVG(S.bowl, bowlType(), S.tray);
  const done = completeMenu();
  $("#bowlLabel").textContent = done ? MENU[done].short+" 완성!"+(S.tray?"":" 쟁반 올리기") : "";
  const t=$("#tray"); t.classList.toggle("on", S.tray);
  t.innerHTML = trayIcon()+(S.tray?"쟁반 ✓":"정식 쟁반");
  updateServe();
}
function updateServe(){
  const done = completeMenu(), btn=$("#serve"), sub=$("#serveSub");
  let ok=false, msg="";
  if(done && S.tray){ ok = !!urgentFor(done); msg = ok ? "" : "주문 손님 없음"; }
  else if(done){ msg="쟁반 먼저"; }
  btn.disabled = !ok || !(S.phase==="play"||S.phase==="tutorial");
  btn.classList.toggle("ready", ok);
  sub.textContent = msg;
}

/* ---------- 입력 ---------- */
function canAct(){ return S.phase==="play" || S.phase==="tutorial"; }
function tapIng(x, btn){
  if(!canAct()) return;
  const pool = S.bowl.length ? S.cands : S.unlocked;
  const ok = pool.filter(id=>canAdd(id, S.bowl, x));
  if(ok.length){
    S.bowl.push(x); S.cands = ok; if(completeMenu()) sfx.done(); else sfx.tap();
  } else {
    sfx.bad(); S.score = Math.max(0, S.score + SC.wrong); S.streak = 0;
    const bw=$("#bowl"); bw.classList.remove("shake"); void bw.offsetWidth; bw.classList.add("shake");
    btn.classList.remove("bad"); void btn.offsetWidth; btn.classList.add("bad");
    if(S.tut) toast("순서가 달라요 — 레시피 카드를 봐 주세요");
  }
  renderBowl(); renderRecipe(); updateHUD(); tutStep();
}
$("#tray").addEventListener("click", ()=>{
  if(!canAct()) return;
  S.tray = !S.tray; sfx.tray(); renderBowl(); tutStep();
});
$("#trash").addEventListener("click", ()=>{
  if(!canAct() || (!S.bowl.length && !S.tray)) return;
  S.bowl=[]; S.cands=[]; S.tray=false; sfx.tap(); renderBowl(); renderRecipe(); tutStep();
});
$("#serve").addEventListener("click", ()=>{
  if(!canAct()) return;
  const id = completeMenu(); if(!id || !S.tray) return;
  const c = urgentFor(id); if(!c) return;
  const mastered = S.mastered.has(id);
  let pts = SC.serve + Math.round(SC.patienceBonus * Math.max(0,c.pat)) + (mastered ? SC.mastery : 0);
  S.streak++; if(S.streak % 3 === 0){ pts += SC.combo; toast("콤보! +"+SC.combo); }
  S.score += pts; S.served++; S.servedBy[id] = (S.servedBy[id]||0)+1;
  S.log.push(Math.round(S.t*10)/10);
  sfx.serve(); popAt(c, "+"+pts); if(c.face) c.face.innerHTML = face("joy");
  freeSeat(c);
  if(S.servedBy[id] === G.masteryCount && !mastered){ S.mastered.add(id); setTimeout(()=>toast("★ "+MENU[id].short+" 숙련! 이제 레시피가 숨겨져요", 2200), 300); }
  S.bowl=[]; S.cands=[]; S.tray=false;
  renderBowl(); renderRecipe(); updateHUD();
  if(S.tut) endTutorial(false);
});

/* ---------- 튜토리얼 ---------- */
const guideEl = $("#guide"), coachEl = $("#coach");
function pointAt(el){
  if(!el){ guideEl.style.display="none"; return; }
  const r = el.getBoundingClientRect();
  guideEl.style.left = (r.left + r.width/2)+"px"; guideEl.style.top = (r.top + r.height/2)+"px"; guideEl.style.display="block";
}
function coach(html){ coachEl.innerHTML = html; coachEl.style.display="block"; $("#skipTut").classList.add("show"); $("#top").classList.add("tut"); }
$("#skipTut").addEventListener("click", ()=>endTutorial(true));
function tutStep(){
  if(!S.tut) return;
  const id="sakedong", m=MENU[id];
  const done = completeMenu();
  if(done && S.tray){ coach('<b>이제 [내기]!</b> 손님에게 바로 나가요.'); pointAt($("#serve")); return; }

function checkUnlock(){
  for(const id of MENU_IDS){
    const at = (G.unlock && G.unlock[id]!=null) ? G.unlock[id] : 0;
    if(at <= S.t && !S.unlocked.includes(id)){
      const before = pantryIds();
      S.unlocked.push(id);
      buildPantry(S.t>0 ? pantryIds().filter(x=>!before.includes(x)) : null);   // 시작 시엔 강조 없음
      if(S.phase==="play" && S.t>0){
        S.forceNext = id; sfx.open();
        if(!store.get("tip_"+id)){
          store.set("tip_"+id,"1");
          pause("tip");
          modal('<div style="font-size:12px;font-weight:800;color:var(--accent2)">신메뉴 오픈</div><h3>'+esc(MENU[id].name)+'</h3><p>'+esc(MENU[id].tip)+'</p><button class="big" id="tipOk">확인하고 계속</button>');
          $("#tipOk").onclick = ()=>{ closeModal(); resume(); };
        } else toast("신메뉴 오픈: "+MENU[id].name);
      }
    }
  }
}

/* ---------- 진행 ---------- */
function pause(kind){ if(S.phase==="play"||S.phase==="tutorial"){ S.prev=S.phase; S.phase=kind||"paused"; updateServe(); } }
function resume(){ if(S.prev){ S.phase=S.prev; S.prev=null; last=performance.now(); updateServe(); } }
document.addEventListener("visibilitychange", ()=>{
  if(document.hidden && (S.phase==="play"||S.phase==="tutorial")){
    pause("paused");
    modal('<h3>잠시 쉬는 중</h3><p>영업은 멈춰 있어요.</p><button class="big" id="resumeBtn">계속하기</button>');
    $("#resumeBtn").onclick = ()=>{ closeModal(); resume(); };
  }
});
function startPlay(){
  S.phase="play"; S.t=0; S.nextSpawn = seated().length ? 2 : 0;
  banner("영업 시작!"); sfx.open(); updateServe();
}
function newGame(){
  closeModal(); $("#result").classList.remove("show"); $("#result").scrollTop=0;
  S = fresh(); buildSeats(); checkUnlock(); renderBowl(); renderRecipe(); updateHUD();
  track("game_start");
  if(store.get("tut")!=="1"){
    S.phase="tutorial"; S.tut=true;
    const c = spawn("sakedong"); S.tutCust = c;
    requestAnimationFrame(()=>requestAnimationFrame(tutStep));
  } else {
    spawn("sakedong"); startPlay(); S.nextSpawn = 2;
  }
  renderRecipe();
}
let last = performance.now();
function loop(now){
  const dt = Math.min(.1, (now-last)/1000); last = now;
  if(S && S.phase==="play"){
    S.t += dt;
    checkUnlock();
    if(S.phase==="play"){
      S.nextSpawn -= dt;
      if(!seated().length && !S.queue.length) S.nextSpawn = Math.min(S.nextSpawn, 1.5);
      while(S.queue.length && seated().length < seatLimit() && S.seats.includes(null)){ const n=S.queue.shift(); n.pat=1; seatCustomer(n); }
      if(S.nextSpawn <= 0){
        spawn();
        const f = Math.min(1, S.t / G.seconds);
        S.nextSpawn = G.spawnStart - (G.spawnStart-G.spawnEnd)*f;
      }
      for(const c of seated()){
        if(c.leaving) continue;
        c.pat -= dt / G.patience; setMood(c);
        if(c.pat <= 0){
          S.score = Math.max(0, S.score + SC.leave); S.left++; S.streak=0;
          sfx.leave(); popAt(c, String(SC.leave), true); freeSeat(c);
          if(S.cands.length || S.bowl.length) updateServe();
          renderRecipe();
        }
      }
      if(G.peak && !S.peaked && S.t >= G.peak.at){ S.peaked = true; banner("점심 피크!"); sfx.open(); for(let k=0;k<G.peak.count;k++) spawn(); }
      if(S.t >= G.seconds) endGame();
      updateHUD();
    }
  }
  requestAnimationFrame(loop);
}

function rkDevice(){
  let d = store.get("dev");
  if(!d || !/^[a-zA-Z0-9-]{16,64}$/.test(d)){
    try{ d = crypto.randomUUID(); }catch(e){ d = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,12) + Math.random().toString(36).slice(2,12); }
    store.set("dev", d);
  }
  return d;

async function rkCall(fn, body){
  const ctl = ("AbortController" in window) ? new AbortController() : null;
  const tm = setTimeout(()=>{ if(ctl) ctl.abort(); }, 8000);
  try{
    const r = await fetch(RK.url.replace(/\/+$/,"") + "/rest/v1/rpc/" + fn, { method:"POST", signal: ctl ? ctl.signal : undefined,
      headers:{ "Content-Type":"application/json", "apikey":RK.key, "Authorization":"Bearer "+RK.key }, body: JSON.stringify(body||{}) });
    if(!r.ok) throw new Error("http " + r.status);
    return await r.json();
  } finally { clearTimeout(tm); }
}

  setTimeout(()=>{ $("#result").classList.add("show"); $("#result").scrollTop=0; }, 900);
  rankLoad();
}
function shareUrl(){ const base = (CONFIG.gameUrl||"").trim(); return base ? base + "#share" : location.origin + location.pathname + "?src=share"; }
async function shareIt(){
  track("click_share");
  const text = "연희시오 셰프 도전에서 "+fmt(S.score)+"점("+rankOf(S.score)+")! 나보다 잘 담을 수 있어?";
  const url = shareUrl();
  try{ if(navigator.share){ await navigator.share({title:"연희시오 야탑점 — 오늘의 셰프 도전", text, url}); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text+" "+url); toast("링크를 복사했어요 — 친구에게 붙여넣기!"); return; } }catch(e){}
  modal('<h3>친구에게 도전장</h3><p>아래 링크를 길게 눌러 복사하세요</p><input readonly value="'+esc(url)+'"><button class="ghost" id="mclose">닫기</button>');
  const inp=$("#modalBox input"); inp.focus(); inp.select(); $("#mclose").onclick=closeModal;
}
function loadImg(src, cors){
  return new Promise(res=>{ if(!src) return res(null); const im=new Image(); if(cors) im.crossOrigin="anonymous"; im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
}
function wrapText(ctx, text, x, y, maxW, lh){
  let line=""; const out=[];
  for(const ch of text){ const t=line+ch; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=ch; } else line=t; }
  if(line) out.push(line); out.forEach((l,i)=>ctx.fillText(l, x, y+i*lh)); return out.length;
}
async function makeCard(id, rank){
  const m = MENU[id], W=1080, H=1350, F=getComputedStyle(document.body).fontFamily;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const ctx=cv.getContext("2d");
  const draw = async (withExternal)=>{
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,XMAS?"#0f2e1f":"#2a1c13"); g.addColorStop(.4,XMAS?"#18492f":"#4a3324"); g.addColorStop(.4,"#f7efe1"); g.addColorStop(1,"#efe3cf");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(XMAS){ const C=["#e2463c","#f2c75c","#5fbf6a","#fff4dc"]; ctx.strokeStyle="#0a1f15"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(0,8); for(let x=0;x<=W;x+=270) ctx.quadraticCurveTo(x+135,36,x+270,8); ctx.stroke(); for(let i=0;i<14;i++){ const x=40+i*77, t=((x%270)/270), y=8+4*t*(1-t)*14; ctx.fillStyle=C[i%4]; ctx.beginPath(); ctx.ellipse(x,y+12,8,11,0,0,7); ctx.fill(); } ctx.fillStyle="rgba(255,255,255,.35)"; for(let i=0;i<60;i++){ const x=(i*263)%W; if(x>190 && x<890) continue; ctx.beginPath(); ctx.arc(x,70+(i*131)%450,2+(i%3),0,7); ctx.fill(); } }
    else for(const x of [270,540,810]){ const rg=ctx.createRadialGradient(x,0,10,x,0,260); rg.addColorStop(0,"rgba(246,201,106,.5)"); rg.addColorStop(1,"rgba(246,201,106,0)"); ctx.fillStyle=rg; ctx.fillRect(x-260,0,520,260); }
    ctx.textAlign="center"; ctx.fillStyle="#f6e6c8"; ctx.font="700 40px "+F; ctx.fillText(XMAS ? "Merry Christmas · "+CONFIG.store.name : CONFIG.store.name+" · 오늘의 셰프 도전", W/2, 116);
    ctx.fillStyle=XMAS?"#f2c75c":"#f6c96a"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(W/2-190,150,380,84,42) : ctx.rect(W/2-190,150,380,84); ctx.fill();
    ctx.fillStyle="#3a2200"; ctx.font="900 46px "+F; ctx.fillText(rank, W/2, 208);
    ctx.fillStyle="#fff4dc"; ctx.font="900 150px "+F; ctx.fillText(fmt(S.score), W/2, 390);
    ctx.font="700 36px "+F; ctx.fillStyle="#e9d7b8"; ctx.fillText("응대 "+S.served+"명 · 숙련 "+S.mastered.size+"개", W/2, 482);
    // 메뉴 그림
    let dish=null;
    if(withExternal && IMAGES.menu[id]) dish = await loadImg(IMAGES.menu[id], true);
    if(dish){
      const dw=860, dh=390, s=Math.max(dw/dish.width, dh/dish.height), sw=dw/s, sh=dh/s;
      ctx.save(); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(110,520,dw,dh,32) : ctx.rect(110,520,dw,dh); ctx.clip();
      ctx.drawImage(dish,(dish.width-sw)/2,(dish.height-sh)/2,sw,sh,110,520,dw,dh); ctx.restore();
    } else {
      const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 140" width="880" height="560">'+bowlSVG(allIngs(id), m.bowl==="soup"?"soup":"don", true)+'</svg>';
      const im = await loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg), false);
      if(im) ctx.drawImage(im, 230, 520, 620, 395);
    }
    ctx.fillStyle="#2b2420"; ctx.font="900 54px "+F; ctx.fillText(m.resultName || m.name, W/2, 985);
    ctx.fillStyle="#fff1dc"; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(90,1010,900,212,28) : ctx.rect(90,1010,900,212); ctx.fill();
    ctx.fillStyle="#b44c20"; ctx.font="900 30px "+F; ctx.fillText("연희시오가 추천하는 먹는 법", W/2, 1056);
    ctx.textAlign="left"; ctx.fillStyle="#5a3a1a"; ctx.font="700 32px "+F;
    m.howto.slice(0,3).forEach((t,i)=>{ ctx.fillText((i+1)+". "+t, 130, 1108+i*46); });
    ctx.textAlign="center";
    ctx.fillStyle="#6a5a4c"; ctx.font="600 28px "+F; ctx.fillText(CONFIG.store.address, W/2, 1272);
    ctx.fillText("네이버에서 ‘연희시오 야탑점’ 검색", W/2, 1314);
    if(withExternal && IMAGES.qr){ const q = await loadImg(IMAGES.qr, true); if(q){ ctx.fillStyle="#fff"; ctx.fillRect(W-200,H-200,170,170); ctx.drawImage(q,W-192,H-192,154,154); } }
  };
  let url;
  try{ await draw(true); url = cv.toDataURL("image/png"); }
  catch(e){ try{ ctx.clearRect(0,0,W,H); await draw(false); url = cv.toDataURL("image/png"); }catch(e2){ toast("이 브라우저에서는 카드를 만들 수 없어요"); return; } }
  modal('<h3>결과 카드</h3><p>이미지를 <b>길게 눌러 저장</b>하세요</p><img class="card" alt="결과 카드" src="'+url+'">'+
        '<a class="ghost" download="yeonhuisio-chef.png" href="'+url+'">이미지 저장</a><button class="ghost" id="mclose">닫기</button>');
  $("#mclose").onclick = closeModal;
}

/* ---------- 시작 ---------- */
window.addEventListener("resize", ()=>{ if(S && S.tut) tutStep(); });
buildSeats();
newGame();
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(loop); });
})();
</script>
